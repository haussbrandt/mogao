[anki]
enabled = false
url = "http://localhost:8765"
deck = "Mandarin Sentence Mining"
model = "Mandarin Sentence Mining"

[anki.fields]
word = "Simplified"
pinyin = "Pinyin.1"
sentence = "SentenceSimplified"
meaning = "Meaning"
sentence_pinyin = "SentencePinyin.1"
sentence_meaning = "SentenceMeaning"
word_audio = "Audio"
sentence_audio = "SentenceAudio"
sentence_image = "SentenceImage"

[anki.tags]
app = "mogao"
needs_processing = "needs-processing"
needs_audio = "needs-audio"

[paths]
library = "library"
video_library = "video_library"
dictionary = "dicts/cedict_ts.u8"
frequencies = "dicts/freqs"

[postprocessing.text]
enabled = false
llm = "gemini-flash-latest"
batch_size = 5
timeout = 3600

[postprocessing.audio]
enabled = false
voice_id = "nhhJXuFAYDroPyaJSlVA"

[dictionary_generation]
enabled = false
llm = "gemini-3.5-flash-lite"
chunk_size = 20000
requests_per_minute = 14
