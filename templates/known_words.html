<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Known Words - Mogao</title>
    <link rel="stylesheet" href="{{ url_for('static', path='library.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='shared.css') }}?v=13" />
    <link rel="stylesheet" href="{{ url_for('static', path='known_words.css') }}?v=4" />
    <link rel="stylesheet" href="{{ url_for('static', path='known_words_page.css') }}?v=2" />
    <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon-32x32.png') }}" />
  </head>
  <body data-anki-enabled="true">
    <main class="container known-words-page">
      <div class="header-row">
        <div class="library-switcher" data-library-switcher>
          <h1>
            <button type="button" class="library-switcher-trigger" aria-expanded="false" aria-controls="library-switcher-menu" data-library-switcher-trigger>
              Known Words <span class="library-switcher-chevron" aria-hidden="true"></span>
            </button>
          </h1>
          {% with current_section="known_words" %}{% include "section_navigation.html" %}{% endwith %}
        </div>
      </div>
      <input id="known-words-search" type="search" placeholder="Chinese, pinyin or meaning" aria-label="Search known words by Chinese, pinyin or meaning" autocomplete="off" />
      <p id="known-words-search-status" role="status"></p>
      <p id="known-words-count" role="status"></p>
      <ul id="known-words-list"></ul>
      <p id="known-words-empty" hidden>No words marked yet.</p>
      <button id="known-words-more" type="button" class="local-known-action" hidden>Show more</button>
      <div id="known-words-notice"></div>
    </main>
    {% include 'dictionary_dialog.html' %}
    <script>
      window.MOGAO_CONFIG = {
        ankiEnabled: true,
        localKnownWords: {{ local_vocabulary.words | tojson }},
        localKnownRevision: {{ local_vocabulary.revision | tojson }}
      };
    </script>
    <script src="{{ url_for('static', path='library_controls.js') }}?v=3" defer></script>
    <script src="{{ url_for('static', path='known_words.js') }}?v=9" defer></script>
    <script src="{{ url_for('static', path='dictionary.js') }}?v=12" defer></script>
    <script src="{{ url_for('static', path='vocabulary_search.js') }}?v=1" defer></script>
    <script src="{{ url_for('static', path='known_words_page.js') }}?v=6" defer></script>
  </body>
</html>
