<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mogao Video Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='shared.css') }}?v=13"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='video.css') }}?v=3" />
    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ url_for('static', path='apple-touch-icon.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', path='favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', path='favicon-16x16.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', path='site.webmanifest') }}"
    />
  </head>
  <body>
    <div id="player-toolbar">
      <a
        id="video-library-back"
        class="subtitle-action"
        href="{{ url_for('video_library_view') }}"
      >
        <span aria-hidden="true">←</span>
        Library
      </a>
      <div id="subtitle-controls">
        {% if has_subtitles %}
        <button
          id="subtitle-mode-toggle"
          class="subtitle-action"
          type="button"
          aria-pressed="false"
          aria-controls="transcript-panel"
        >
          Transcript
        </button>
        <details id="subtitle-menu-container">
          <summary
            id="subtitle-menu-toggle"
            class="subtitle-action"
            aria-label="Subtitle options"
          >
            ⋮
          </summary>
          <div id="subtitle-menu">
            <button id="replace-subtitles" type="button">
              Replace subtitles
            </button>
            <button id="remove-subtitles" type="button">
              Remove subtitles
            </button>
          </div>
          <input type="file" id="sub-input" accept=".srt" hidden />
        </details>
        {% else %}
        <span id="sub-upload-status"></span>
        <label id="sub-upload-btn" class="subtitle-action">
          Upload subtitles (.srt)
          <input type="file" id="sub-input" accept=".srt" hidden />
        </label>
        {% endif %}
      </div>
    </div>
    <div id="player-layout">
      <div id="player-container">
        <video
          id="video"
          controls
          src="{{ video_base_path }}/stream/{{ video_id }}"
        ></video>
        <div id="subtitle-overlay" data-lookup-root></div>
      </div>
      {% if has_subtitles %}
      <aside id="transcript-panel" aria-label="Video transcript" hidden>
        <div id="transcript-header">Transcript</div>
        <div id="transcript-lines"></div>
      </aside>
      {% endif %}
    </div>

    <div id="def-popup">
      <div class="popup-header">
        <span class="popup-title">Definition</span>
        <button class="close-btn" id="close-popup">✕</button>
      </div>
      <div class="popup-body" id="pop-body"></div>
    </div>
  </body>

  <!-- prettier-ignore -->
  <script>
    window.MOGAO_CONFIG = {
      videoId: "{{ video_id }}",
      videoBasePath: "{{ video_base_path }}",
      generatedDictionaryUrl: {{ (video_base_path ~ "/api/video-dict/" ~ video_id) | tojson }},
      initialPlaybackTime: {{ initial_playback_time | tojson }},
      hasSubtitles: {{ has_subtitles | tojson }},
      ankiEnabled: {{ anki_enabled | tojson }},
      deckWords: {{ deck_words | tojson }},
      knownWords: {{ known_words | tojson }},
    };
  </script>

  <script src="{{ url_for('static', path='textprocessor.js') }}?v=3"></script>
  {% if anki_enabled %}
  <script src="{{ url_for('static', path='anki.js') }}?v=5"></script>
  {% endif %}
  <script src="{{ url_for('static', path='segmenter.js') }}?v=4"></script>
  <script src="{{ url_for('static', path='dictionary.js') }}?v=7"></script>
  <script src="{{ url_for('static', path='video.js' )}}?v=5"></script>
</html>
