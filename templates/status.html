<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mogao Status</title>
    <link rel="stylesheet" href="{{ url_for('static', path='library.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='status.css') }}" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', path='favicon-32x32.png') }}"
    />
  </head>
  <body
    class="status-page"
    data-status-content-url="{{ url_for('status_content') }}"
  >
    <div class="container">
      <div class="header-row">
        <div class="library-switcher" data-library-switcher>
          <h1>
            <button
              type="button"
              class="library-switcher-trigger"
              aria-expanded="false"
              aria-controls="library-switcher-menu"
              data-library-switcher-trigger
            >
              Status
              <span class="library-switcher-chevron" aria-hidden="true"></span>
            </button>
          </h1>
          <nav
            id="library-switcher-menu"
            class="library-switcher-menu"
            aria-label="Choose section"
            data-library-switcher-menu
            hidden
          >
            <a href="/">Books</a>
            {% if video_enabled %}
            <a href="{{ url_for('video_library_view') }}">Videos</a>
            {% endif %}
            <a href="/status" aria-current="page">Status</a>
          </nav>
        </div>
      </div>

      <p class="status-warning" data-status-connection role="status" hidden></p>
      <p class="status-error" data-status-action-error role="alert" hidden></p>
      {% include "status_content.html" %}
    </div>
    <script src="{{ url_for('static', path='library_controls.js') }}"></script>
    <script src="{{ url_for('static', path='status.js') }}"></script>
  </body>
</html>
