[anki]
enabled = true
url = "http://localhost:8765"
deck = "Mogao Sentence Mining"
model = "Mogao Sentence Mining"

[anki.fields]
word = "Word"
pinyin = "Pinyin"
sentence = "Sentence"
meaning = "Meaning"
sentence_pinyin = "SentencePinyin"
sentence_meaning = "SentenceMeaning"
word_audio = "Audio"
sentence_audio = "SentenceAudio"
sentence_image = "SentenceImage"

[anki.tags]
app = "mogao"
needs_processing = "needs-processing"
needs_audio = "needs-audio"

[paths]
library = "library"
video_library = "video_library"

[video]
enabled = true

[postprocessing.text]
enabled = true
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
llm = "gemini-flash-latest"
batch_size = 5
timeout = 3600

[postprocessing.audio]
enabled = true
voice_id = "nhhJXuFAYDroPyaJSlVA"

[dictionary_generation]
enabled = true
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
llm = "gemini-3.5-flash-lite"
chunk_size = 20000
requests_per_minute = 14
