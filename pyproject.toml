[project]
name = "mogao"
version = "1.19.2"
description = "An ebook reader for sentence mining from Chinese books"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.14.3",
    "ebooklib>=0.20",
    "elevenlabs>=2.33.1",
    "fastapi>=0.128.0",
    "ffmpeg-python>=0.2.0",
    "jinja2>=3.1.6",
    "nh3>=0.3.6",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
]
